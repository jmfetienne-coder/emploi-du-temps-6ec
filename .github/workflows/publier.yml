# Publie docs/ sur GitHub Pages — et ne le publie QUE si les contrôles passent.
#
# La raison d'avoir ce fichier plutôt que de servir docs/ directement :
#
# 1. `verifier_app.py` tourne AVANT le déploiement. Il réengendre la
#    page et la compare à celle du dépôt, relit les données contre
#    donnees_planning.py, et mesure le contraste des quatorze matières. Un
#    fichier retouché à la main, ou un emploi du temps corrigé sans
#    réengendrer, n'atteint pas le site — il fait échouer la construction.
#
# Le harnais des PDF (verifier_planning.py) n'est pas ici : il demande
# lualatex et PyMuPDF, et les affiches ne sont pas ce que ce site sert.

name: Publier le planning

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  controler:
    name: Les 764 contrôles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer PyMuPDF, qui sert à relire les PDF
        run: python3 -m pip install --quiet pymupdf
      - name: La page dit-elle ce que disent les données ?
        run: python3 verifier_app.py
      - name: Les PDF composent-ils ce que disent les données ?
        run: python3 verifier_planning.py
      - name: Le README dit-il encore la vérité ?
        run: python3 verifier_readme.py

  publier:
    name: Déployer sur Pages
    needs: controler
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Sans `enablement: true` : activer Pages la première fois demande les
      # droits d'administration du dépôt, que le jeton de l'action ne porte
      # pas — la construction échouait sur « Must have admin rights to
      # Repository ». La source est désormais réglée sur GitHub Actions dans
      # les paramètres, une fois pour toutes, et l'action n'a plus qu'à lire
      # cette configuration.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploiement
        uses: actions/deploy-pages@v4
